name: Check formal proofs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bendlang/bend
          ref: 79df8d9c40722ee9507a1e253f283b51025f9d6c
          path: bend
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install the Lean toolchain of the proven kernel
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: bun bend/bend2/main.ts PROOF.bend --verdict
      - run: bun bend/bend2/main.ts tests/arithmetic.bend --verdict
      - run: bun bend/bend2/main.ts tests/ring.bend --verdict
      - run: bun bend/bend2/main.ts tests/field.bend --verdict
      - run: bun bend/bend2/main.ts tests/field_ring.bend --verdict
      - run: bun bend/bend2/main.ts FieldRing.bend --verdict
      - run: bun bend/bend2/main.ts FieldOrder.bend --verdict
      - run: bun bend/bend2/main.ts tests/certificate.bend --verdict
      - run: python3 -S -m unittest discover -s tools -p test_certificate.py
      - name: Reject a non-Cauchy sequence
        run: |
          if output=$(bun bend/bend2/main.ts tests/non_cauchy.bend --check-only 2>&1); then
            exit 1
          fi
          case "$output" in
            *'expected : Sigma<'*'observed : Unit'*'Location: bad'*) ;;
            *) printf '%s\n' "$output"; exit 1 ;;
          esac
      - name: Reject unchecked escape hatches
        run: |
          if grep -R -nE '@unsafe|\bforeign\b|\?TODO|\baxiom\b' --include='*.bend' --exclude-dir=bend .; then
            exit 1
          fi
